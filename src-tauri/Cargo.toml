[package]
name = "flash-launcher"
version = "0.4.0"
edition = "2021"
description = "Flash Launcher — a Minecraft: Java Edition launcher"
license = "MIT"

[lib]
name = "flash_launcher_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-updater = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "2", features = ["json", "tls", "native-certs"] }
base64 = "0.22"
dirs = "5"

[profile.release]
strip = true
lto = "thin"
codegen-units = 4
