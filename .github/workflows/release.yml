# Builds Flash Launcher for Windows (NSIS installer) and Linux (AppImage, .deb), signs the update
# packages, publishes a GitHub Release, and writes server/releases.json on main so the update
# server (Vercel project flash-launcher-api) tells every launcher about the new version.
#
# Release: bump the version (src-tauri/tauri.conf.json, src-tauri/Cargo.toml, package.json),
# write release-notes.md, then push a tag:  git tag v0.4.1 && git push origin v0.4.1
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

env:
  # The game engine: Horizon Offline Launcher's CLI, built from a pinned commit with our patch.
  ENGINE_REPO: https://github.com/gerdaroot/Horizon-Offline-Launcher
  ENGINE_REF: dfc2b49848d0d53678f45ef11b089f7ed5b636bc
  HORIZON_LAUNCHER_NO_SELF_UPDATE: "1"

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            triple: x86_64-pc-windows-msvc
            ext: .exe
            bundles: nsis
          - os: ubuntu-22.04
            triple: x86_64-unknown-linux-gnu
            ext: ""
            bundles: deb,appimage
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Linux libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libayatana-appindicator3-dev \
            libxkbcommon-x11-dev libwayland-dev libx11-xcb-dev libfontconfig-dev libvulkan-dev libasound2-dev patchelf

      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Engine source
        run: |
          git clone --filter=blob:none "$ENGINE_REPO" engine
          git -C engine checkout "$ENGINE_REF"
          git -C engine apply ../patches/engine.patch

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            engine/launcher
            src-tauri
          key: ${{ matrix.triple }}

      - name: Build the engine
        working-directory: engine/launcher
        run: cargo build --release --locked

      - name: Engine as the app's sidecar
        run: cp "engine/launcher/target/release/horizon-launcher${{ matrix.ext }}" "src-tauri/binaries/flash-engine-${{ matrix.triple }}${{ matrix.ext }}"

      - run: npm ci

      - name: Build and sign Flash Launcher
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npx tauri build --bundles ${{ matrix.bundles }}

      - uses: actions/upload-artifact@v4
        with:
          name: bundle-${{ matrix.triple }}
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/nsis/*.sig
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/appimage/*.sig
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/deb/*.sig
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Release files and update manifest
        run: node tools/release-ci.mjs artifacts "https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}"
      - uses: softprops/action-gh-release@v2
        with:
          name: Flash Launcher ${{ github.ref_name }}
          body_path: release-notes.md
          files: upload/*
      - name: Tell the update server
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898299+github-actions[bot]@users.noreply.github.com"
          git add server/releases.json
          git commit -m "Update manifest for ${{ github.ref_name }}"
          git push origin HEAD:main
