# Builds Flash Launcher for Windows (NSIS installer) and Linux (AppImage, .deb), signs the update
# packages and publishes a GitHub Release with releases.json, the update manifest. The update
# server (Vercel project flash-launcher-api) reads that file from the latest release, so every
# launcher sees the new version within minutes. Needs the repository to be public (players
# download the files without a GitHub login) and the secret TAURI_SIGNING_PRIVATE_KEY.
#
# Release: bump the version (src-tauri/tauri.conf.json, src-tauri/Cargo.toml, package.json),
# write release-notes.md and push to main. A version that has no tag vX.Y.Z yet is built and
# released, and the workflow makes the tag itself; any other push to main builds nothing.
name: Release

on:
  push:
    branches: [main]
    paths: ['src-tauri/tauri.conf.json', '.github/workflows/release.yml']
  workflow_dispatch:

permissions:
  contents: write

env:
  # The game engine: Horizon Offline Launcher's CLI, built from a pinned commit with our patch.
  ENGINE_REPO: https://github.com/gerdaroot/Horizon-Offline-Launcher
  ENGINE_REF: dfc2b49848d0d53678f45ef11b089f7ed5b636bc
  HORIZON_LAUNCHER_NO_SELF_UPDATE: "1"

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      new: ${{ steps.v.outputs.new }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        run: |
          version=$(node -p "require('./src-tauri/tauri.conf.json').version")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if git ls-remote --exit-code --tags origin "refs/tags/v$version" > /dev/null; then
            echo "new=false" >> "$GITHUB_OUTPUT"; echo "v$version is already released"
          else
            echo "new=true" >> "$GITHUB_OUTPUT"; echo "Releasing v$version"
          fi

  build:
    needs: version
    if: needs.version.outputs.new == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            triple: x86_64-pc-windows-msvc
            ext: .exe
            bundles: nsis
          - os: ubuntu-22.04
            triple: x86_64-unknown-linux-gnu
            ext: ""
            bundles: deb,appimage
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Linux libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libayatana-appindicator3-dev \
            libxkbcommon-x11-dev libwayland-dev libx11-xcb-dev libfontconfig-dev libvulkan-dev libasound2-dev patchelf

      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Engine source
        run: |
          git clone --filter=blob:none "$ENGINE_REPO" engine
          git -C engine checkout "$ENGINE_REF"
          git -C engine apply ../patches/engine.patch

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            engine/launcher
            src-tauri
          key: ${{ matrix.triple }}

      - name: Build the engine
        working-directory: engine/launcher
        run: cargo build --release --locked

      - name: Engine as the app's sidecar
        run: cp "engine/launcher/target/release/horizon-launcher${{ matrix.ext }}" "src-tauri/binaries/flash-engine-${{ matrix.triple }}${{ matrix.ext }}"

      - run: npm ci

      - name: Build and sign Flash Launcher
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npx tauri build --bundles ${{ matrix.bundles }}

      - uses: actions/upload-artifact@v4
        with:
          name: bundle-${{ matrix.triple }}
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/nsis/*.sig
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/appimage/*.sig
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/deb/*.sig
          if-no-files-found: error

  release:
    needs: [version, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Release files and update manifest
        run: node tools/release-ci.mjs artifacts "https://github.com/${{ github.repository }}/releases/download/v${{ needs.version.outputs.version }}"
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: Flash Launcher v${{ needs.version.outputs.version }}
          make_latest: true
          body_path: release-notes.md
          files: upload/*
